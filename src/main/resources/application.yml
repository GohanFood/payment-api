spring:
  application:
    name: payment-api

  datasource:
    url: jdbc:postgresql://localhost:5434/paymentdb
    username: ${SPRING_DATASOURCE_USERNAME:paymentapi}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: payment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET}

payment:
  kafka:
    enabled: ${PAYMENT_KAFKA_ENABLED:false}

payment-callback:
  url: ${PAYMENT_CALLBACK_URL:}
  secret: ${SUBSCRIPTION_CALLBACK_SECRET:}

# ---------------------------------------------------------------------------
# Mercado Pago — Exclusivamente SANDBOX
# ---------------------------------------------------------------------------
# Environment: fixo como "sandbox". Tokens de produção (APP_USR-) são rejeitados.
# Access Token: gere em https://www.mercadopago.com.br/settings/account/credentials
#   Use SEMPRE um token de teste (prefixo TEST-).
# Public Key: chave pública sandbox usada no frontend (MercadoPago.js CardForm)
# Webhook Secret: chave secreta para validação HMAC-SHA256 dos webhooks
mercadopago:
  environment: ${MERCADOPAGO_ENVIRONMENT:sandbox}
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  public-key: ${MERCADOPAGO_PUBLIC_KEY:}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}

server:
  port: 8082

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
