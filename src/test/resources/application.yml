spring:
  application:
    name: payment-api

  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

jwt:
  secret: YnVzY2FuZG9Vc2VyQVBJU2VjcmV0QXNzZW1ibHlBcHBsaWNhdGlvbjIwMjY=

payment:
  kafka:
    enabled: false

server:
  port: 0
